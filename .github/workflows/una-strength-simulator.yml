name: UNA Strength Simulator Test
on:
  workflow_dispatch:
  push:
    branches: [una-strength-rc1]
    paths:
      - RC1_TRIGGER
jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v4
      - name: Install simulator dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build libsdl2-dev
      - name: Clone official UNA SDK
        run: git clone --depth 1 --recurse-submodules https://github.com/UNAWatch/una-sdk.git "$RUNNER_TEMP/una-sdk"
      - name: Overlay UNA Strength onto official HelloWorld LVGL simulator
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$RUNNER_TEMP/una-sdk"
          GUI="$SDK/Docs/Tutorials/HelloWorld/Software/Apps/LVGL-GUI"
          cp una-strength/MainScreen.hpp "$GUI/gui/include/gui/screens/MainScreen.hpp"
          cp una-strength/MainScreen.cpp "$GUI/gui/src/screens/MainScreen.cpp"
          cp una-strength/Model.hpp "$GUI/gui/include/gui/model/Model.hpp"
          cp una-strength/ModelListener.hpp "$GUI/gui/include/gui/model/ModelListener.hpp"
          cp una-strength/Model.cpp "$GUI/gui/src/model/Model.cpp"
          cp una-strength/simulator_main.cpp "$GUI/simulator/main.cpp"
          LIBS="$SDK/Docs/Tutorials/HelloWorld/Software/Libs"
          cp una-strength/Commands.hpp "$LIBS/Header/Commands.hpp"
          cp una-strength/Service.hpp "$LIBS/Header/Service.hpp"
          cp una-strength/Service.cpp "$LIBS/Sources/Service.cpp"
          mkdir -p "$GUI/gui/include/una_strength" "$GUI/gui/src/una_strength"
          cp una-strength/core/model.hpp "$GUI/gui/include/una_strength/model.hpp"
          cp una-strength/core/session.hpp "$GUI/gui/include/una_strength/session.hpp"
          cp una-strength/core/controller.hpp "$GUI/gui/include/una_strength/controller.hpp"
          cp una-strength/core/json_io.hpp "$GUI/gui/include/una_strength/json_io.hpp"
          cp una-strength/core/workout_repository.hpp "$GUI/gui/include/una_strength/workout_repository.hpp"
          cp una-strength/core/free_workout.hpp "$GUI/gui/include/una_strength/free_workout.hpp"
          cp una-strength/core/free_controller.hpp "$GUI/gui/include/una_strength/free_controller.hpp"
          cp una-strength/core/history.hpp "$GUI/gui/include/una_strength/history.hpp"
          cp una-strength/core/heart_rate.hpp "$GUI/gui/include/una_strength/heart_rate.hpp"
          cp una-strength/core/una_hr_adapter.hpp "$GUI/gui/include/una_strength/una_hr_adapter.hpp"
          cp una-strength/core/session.cpp "$GUI/gui/src/una_strength/session.cpp"
          cp una-strength/core/controller.cpp "$GUI/gui/src/una_strength/controller.cpp"
          cp una-strength/core/json_io.cpp "$GUI/gui/src/una_strength/json_io.cpp"
          cp una-strength/core/workout_repository.cpp "$GUI/gui/src/una_strength/workout_repository.cpp"
          cp una-strength/core/free_workout.cpp "$GUI/gui/src/una_strength/free_workout.cpp"
          cp una-strength/core/free_controller.cpp "$GUI/gui/src/una_strength/free_controller.cpp"
          cp una-strength/core/history.cpp "$GUI/gui/src/una_strength/history.cpp"
          cp una-strength/core/heart_rate.cpp "$GUI/gui/src/una_strength/heart_rate.cpp"
          mkdir -p "$SDK/Docs/Tutorials/HelloWorld/Software/Output/workouts"
          cp una-strength/workout_yesterday.json "$SDK/Docs/Tutorials/HelloWorld/Software/Output/workouts/yesterday.json"
          cp una-strength/workout_today.json "$SDK/Docs/Tutorials/HelloWorld/Software/Output/workouts/today.json"
          cp una-strength/workout_tomorrow.json "$SDK/Docs/Tutorials/HelloWorld/Software/Output/workouts/tomorrow.json"
      - name: Strict portable-core regression tests
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$RUNNER_TEMP/una-sdk"
          GUI="$SDK/Docs/Tutorials/HelloWorld/Software/Apps/LVGL-GUI"
          INC="$GUI/gui/include"
          SRC="$GUI/gui/src/una_strength"
          CXXFLAGS="-std=c++17 -Wall -Wextra -Wpedantic -Werror -I$INC"
          g++ $CXXFLAGS "$SRC/session.cpp" "$SRC/controller.cpp" "$SRC/heart_rate.cpp" una-strength/tests/rc1_session_test.cpp -o /tmp/rc1_session_test
          g++ $CXXFLAGS "$SRC/session.cpp" "$SRC/controller.cpp" "$SRC/heart_rate.cpp" una-strength/tests/rc1_controller_hr_test.cpp -o /tmp/rc1_controller_hr_test
          /tmp/rc1_session_test
          /tmp/rc1_controller_hr_test

      - name: Sanitizer portable-core regression tests
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$RUNNER_TEMP/una-sdk"
          GUI="$SDK/Docs/Tutorials/HelloWorld/Software/Apps/LVGL-GUI"
          INC="$GUI/gui/include"
          SRC="$GUI/gui/src/una_strength"
          FLAGS="-std=c++17 -fsanitize=address,undefined -fno-omit-frame-pointer -I$INC"
          g++ $FLAGS "$SRC/session.cpp" "$SRC/controller.cpp" "$SRC/heart_rate.cpp" una-strength/tests/rc1_session_test.cpp -o /tmp/rc1_session_san
          g++ $FLAGS "$SRC/session.cpp" "$SRC/controller.cpp" "$SRC/heart_rate.cpp" una-strength/tests/rc1_controller_hr_test.cpp -o /tmp/rc1_controller_hr_san
          ASAN_OPTIONS=detect_leaks=1 /tmp/rc1_session_san
          ASAN_OPTIONS=detect_leaks=1 /tmp/rc1_controller_hr_san

      - name: Build official UNA LVGL simulator with UNA Strength
        shell: bash
        run: |
          set -euxo pipefail
          export UNA_SDK="$RUNNER_TEMP/una-sdk"
          SIM="$UNA_SDK/Docs/Tutorials/HelloWorld/Software/Apps/LVGL-GUI/simulator"
          cmake -S "$SIM" -B "$SIM/build" -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$SIM/build"
      - name: Run scheduled workout regression test
        shell: bash
        run: |
          set -euxo pipefail
          export UNA_SDK="$RUNNER_TEMP/una-sdk"
          BIN="$UNA_SDK/Docs/Tutorials/HelloWorld/Software/Apps/LVGL-GUI/simulator/build/bin"
          cd "$BIN"
          SDL_VIDEODRIVER=dummy timeout 12s ./HelloWorldLVGLSimulator 2>&1 | tee scheduled.log
          grep -q "UNA_STRENGTH_SCREEN_READY" scheduled.log
          grep -q "UNA_STRENGTH_DATE_SELECT_PASS date=2026-10-03" scheduled.log
          grep -q "UNA_STRENGTH_JSON_IMPORT_PASS id=scheduled-today-pass" scheduled.log
          grep -q "UNA_STRENGTH_REST_REACHED" scheduled.log
          grep -q "UNA_STRENGTH_ROUNDTRIP_PASS" scheduled.log
          RESULT="$(ls -1t "$UNA_SDK"/Docs/Tutorials/HelloWorld/Software/Output/results/*-scheduled.json | head -1)"
          test -s "$RESULT"
          python3 - "$RESULT" <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as f:
              d=json.load(f)
          assert d["workout_id"] == "scheduled-today-pass"
          assert d["total_reps"] == 10
          assert d["training_volume_lb"] == 550
          hr=d["heart_rate"]
          assert hr["available"] is True
          assert hr["sample_count"] >= 1
          assert 120 <= hr["min_bpm"] <= 180
          assert 120 <= hr["avg_bpm"] <= 180
          assert 120 <= hr["max_bpm"] <= 180
          assert len(hr["samples"]) == hr["sample_count"]
          print("SCHEDULED_HR_ASSERTIONS_PASS", hr["sample_count"], hr["avg_bpm"], hr["max_bpm"])
          print("SCHEDULED_JSON_ASSERTIONS_PASS")
          PY
      - name: Run free workout simulator test
        shell: bash
        run: |
          set -euxo pipefail
          export UNA_SDK="$RUNNER_TEMP/una-sdk"
          BIN="$UNA_SDK/Docs/Tutorials/HelloWorld/Software/Apps/LVGL-GUI/simulator/build/bin"
          cd "$BIN"
          UNA_TEST_MODE=free SDL_VIDEODRIVER=dummy timeout 35s ./HelloWorldLVGLSimulator 2>&1 | tee free.log
          grep -q "UNA_FREE_WORKOUT_START date=2026-10-03" free.log
          grep -q "UNA_FREE_REST_REACHED" free.log
          grep -q "UNA_FREE_WORKOUT_PASS exercises=2 reps=16 volume=1585" free.log
          RESULT="$(ls -1t "$UNA_SDK"/Docs/Tutorials/HelloWorld/Software/Output/results/*-free.json | head -1)"
          test -s "$RESULT"
          python3 - "$RESULT" <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as f:
              d=json.load(f)
          assert d["schema_version"] == 1
          assert d["workout_name"] == "Free Workout"
          assert d["date"] == "2026-10-03"
          assert d["total_reps"] == 16
          assert d["training_volume_lb"] == 1585
          assert len(d["exercises"]) == 2

          sq, bench = d["exercises"]
          assert sq["id"] == "pendulum_squat"
          assert sq["added"] is True
          assert len(sq["sets"]) == 2
          assert [(s["actual_reps"], s["actual_weight_lb"]) for s in sq["sets"]] == [(6,60),(5,60)]
          assert all(s["prescribed_reps"] == 0 for s in sq["sets"])
          assert all(s["prescribed_weight_lb"] == 0 for s in sq["sets"])

          assert bench["id"] == "bench_press"
          assert bench["added"] is True
          assert len(bench["sets"]) == 1
          assert bench["sets"][0]["actual_reps"] == 5
          assert bench["sets"][0]["actual_weight_lb"] == 185

          a=d["assessment"]
          assert a["workout_quality"] == 3
          assert a["strength"] == 3
          assert a["energy"] == 3
          assert a["session_rpe"] == 5
          assert a["pain"] == 0
          assert a["expectation"] == "as_expected"
          hr=d["heart_rate"]
          assert hr["available"] is True
          assert hr["sample_count"] >= 1
          assert 120 <= hr["min_bpm"] <= 180
          assert 120 <= hr["avg_bpm"] <= 180
          assert 120 <= hr["max_bpm"] <= 180
          assert len(hr["samples"]) == hr["sample_count"]
          print("FREE_HR_ASSERTIONS_PASS", hr["sample_count"], hr["avg_bpm"], hr["max_bpm"])
          print("FREE_JSON_ASSERTIONS_PASS")
          PY
      - name: Run workout history simulator test
        shell: bash
        run: |
          set -euxo pipefail
          export UNA_SDK="$RUNNER_TEMP/una-sdk"
          BIN="$UNA_SDK/Docs/Tutorials/HelloWorld/Software/Apps/LVGL-GUI/simulator/build/bin"
          cd "$BIN"
          UNA_TEST_MODE=history SDL_VIDEODRIVER=dummy timeout 20s ./HelloWorldLVGLSimulator 2>&1 | tee history.log
          grep -q "UNA_HISTORY_LOAD_PASS count=2" history.log
          grep -q "UNA_HISTORY_DETAIL_PASS name=Free Workout reps=16 volume=1585 rpe=5" history.log
          grep -q "UNA_HISTORY_DETAIL_PASS name=Today Auto Selected Workout reps=10 volume=550 rpe=5" history.log
          grep -q "UNA_HR_SENSOR_CONNECT PASS" scheduled.log
          grep -q "UNA_HR_SENSOR_SAMPLE" scheduled.log
          grep -q "UNA_HR_SUMMARY_PASS" scheduled.log
          grep -q "UNA_HR_SUMMARY_PASS" free.log
          python3 - "$UNA_SDK/Docs/Tutorials/HelloWorld/Software/Output/results" <<'PY'
          import glob, json, os, sys
          root=sys.argv[1]
          files=glob.glob(os.path.join(root,"*.json"))
          assert len(files) == 2, files
          rows=[]
          for p in files:
              with open(p,encoding="utf-8") as f:
                  d=json.load(f)
              assert d["heart_rate"]["available"] is True
              assert d["heart_rate"]["sample_count"] >= 1
              rows.append((d["ended_at_unix_ms"], d["workout_name"], d["total_reps"], d["training_volume_lb"]))
          rows.sort(reverse=True)
          assert {r[1] for r in rows} == {"Free Workout","Today Auto Selected Workout"}
          print("HISTORY_JSON_ASSERTIONS_PASS")
          PY
      - name: Upload simulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: una-strength-simulator-log
          path: |
            ${{ runner.temp }}/una-sdk/Docs/Tutorials/HelloWorld/Software/Apps/LVGL-GUI/simulator/build/bin/scheduled.log
            ${{ runner.temp }}/una-sdk/Docs/Tutorials/HelloWorld/Software/Apps/LVGL-GUI/simulator/build/bin/free.log
            ${{ runner.temp }}/una-sdk/Docs/Tutorials/HelloWorld/Software/Apps/LVGL-GUI/simulator/build/bin/history.log
            ${{ runner.temp }}/una-sdk/Docs/Tutorials/HelloWorld/Software/Output/results/*.json
